*{box-sizing:border-box}

/* ---------- state ---------- */
function onePage(){return settings.flow?settings.flow==='one':CFG.flow==='one'}
function freshOrder(inD){return {step:1,booked:TODAY,warn:'',inD:inD,outD:addDay(inD,1),rooms:{},guests:{},name:'',phone:'',src:'電話',price:{},deposit:'',note:''}}
var T=new Date(),TODAY=ymd(T.getFullYear(),T.getMonth()+1,T.getDate());
var syncing=false,syncMsg='';
var app={tab:'cal',y:T.getFullYear(),m:T.getMonth()+1,sel:TODAY,sort:'rev',ci:null,checkId:null};
app.order=freshOrder(app.sel);

var $head=document.getElementById('head'), $view=document.getElementById('view'), $nav=document.getElementById('nav'), $toast=document.getElementById('toast');
var toastT;
var $dlg=document.getElementById('dlg'), $snack=document.getElementById('snack');
function toast(msg){$toast.textContent=msg;$toast.className='show';clearTimeout(toastT);toastT=setTimeout(function(){$toast.className=''},2600)}

/* ---------- shell ---------- */
var TABS=[['cal','房況','cal'],['order','新增訂單','order'],['checkin','入住登記','checkin'],['rev','營收','rev']];
function renderNav(){
  $nav.innerHTML=TABS.map(function(t){return '<button class="'+(app.tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'">'+ICON[t[2]]+t[1]+'</button>'}).join('');
}
function syncColor(){return !syncCfg.url?'#9A9486':syncing?'#D99A2B':syncMsg?'#B4521F':'#4A7A3F'}
function dot(){return '<i class="sdot" style="background:'+syncColor()+'" title="'+esc(syncLabel())+'"></i>'}
function hdrMonth(sub){
  return '<div class="hdr"><button class="iconbtn" data-act="mon" data-d="-1" aria-label="上個月">'+ICON.left+'</button>'+
   '<div class="t"><b>'+app.y+' 年 '+app.m+' 月</b><span>'+dot()+sub+'</span></div>'+
   '<button class="iconbtn" data-act="mon" data-d="1" aria-label="下個月">'+ICON.right+'</button></div>';
}
function hdrPlain(title){
  return '<div class="hdr"><button class="iconbtn" data-act="tab" data-t="cal" aria-label="回房況">'+ICON.left+'</button><div class="t" style="text-align:left;padding-left:4px"><b style="font-size:26px">'+title+'</b><span style="text-align:left">'+NAMEH+'</span></div><button class="iconbtn" data-act="tab" data-t="settings" aria-label="同步狀態">'+dot()+'</button></div>';
}
function render(){
  renderNav();
  if(app.tab==='cal'){$head.innerHTML=hdrMonth(NAMEH+'　房況');$view.innerHTML=viewCal()}
  else if(app.tab==='order'){$head.innerHTML=hdrPlain(app.order.editIds?'編輯訂單':'新增訂單');$view.innerHTML=viewOrder();refreshOrder()}
  else if(app.tab==='checkin'){$head.innerHTML=hdrPlain('入住登記');$view.innerHTML=viewCheckin();refreshCi()}
  else if(app.tab==='detail'){$head.innerHTML=hdrPlain('訂單詳情');$view.innerHTML=viewDetail()}
  else if(app.tab==='settings'){$head.innerHTML=hdrPlain('設定');$view.innerHTML=viewSettings()}
  else {$head.innerHTML=hdrMonth(NAMEH+'　營收（含已預訂）');$view.innerHTML=viewRev()}
}

/* ---------- calendar ---------- */
function viewCal(){
  var y=app.y,m=app.m,dim=daysIn(y,m),fd=firstDow(y,m);
  var pm=m===1?12:m-1,py=m===1?y-1:y,pdim=daysIn(py,pm);
  var cells='',i;
  for(i=0;i<fd;i++)cells+='<div class="cell off"><b>'+(pdim-fd+1+i)+'</b><span></span></div>';
  for(var d=1;d<=dim;d++){
    var iso=ymd(y,m,d),k=ROOMS.filter(function(r){return find(r.k,iso)}).length;
    var wn=bookings.some(function(b){return b.from===iso&&b.warn});
    var hn=holName(iso),wkd=new Date(Date.parse(iso)).getUTCDay(),hl=!!hn||wkd===0||wkd===6;
    var bar='<i style="position:absolute;left:0;right:0;bottom:0;height:6px;display:flex">'+ROOMS.map(function(r){return '<u style="flex:1;display:block;background:'+(find(r.k,iso)?rc(r):(iso===app.sel?'#5E5A52':'#E3DDD0'))+'"></u>'}).join('')+'</i>';
    var on=iso===app.sel,f=k/ROOMS.length;
    cells+='<button class="cell'+(on?' on':'')+'" data-act="pick" data-d="'+iso+'" aria-label="'+m+' 月 '+d+' 日 週'+wday(iso)+'，已住 '+k+' 間"'+(on?'':' style="background:rgba(180,82,31,'+(0.04+0.32*f).toFixed(2)+')"')+'><b'+(hl?' class="rd"':'')+'>'+d+'</b>'+(hn?'<em class="hol">休</em>':'')+(wn?'<em class="wrn">⚠</em>':'')+'<span>'+(k===0?'空':k+'/'+ROOMS.length)+'</span>'+bar+'</button>';
  }
  var trail=(7-(fd+dim)%7)%7;
  for(i=1;i<=trail;i++)cells+='<div class="cell off"><b>'+i+'</b><span></span></div>';
  var leg='';
  for(i=0;i<=ROOMS.length;i++)leg+='<div style="background:rgba(180,82,31,'+(0.04+0.32*(i/ROOMS.length)).toFixed(2)+')">'+i+'</div>';
  function rows(list){return list.map(function(r){
    var b=find(r.k,app.sel),bk=b?backInfo(b.phone,b.from,b.id):null;
    return '<div class="row"><span class="bar" style="background:'+rc(r)+'"></span><div class="no" style="width:'+(r.label?'92px':'64px')+'"><b>'+(r.label?r.label+' ':'')+r.no+'</b><span>'+r.cap+' 人房</span></div>'+
      '<div class="who"><div><span>'+(b?esc(b.who||'（已清除）')+' · '+b.n+' 人':'空房')+'</span>'+(bk?'<span class="back back-pill">回流</span>':'')+'</div><div class="muted" style="font-size:14px">'+(b?md(b.from)+' – '+md(b.to):'')+'</div>'+(b?'<button class="linkbtn" style="padding:6px 0;font-size:14px;color:#1A72A6;text-align:left" data-act="edit" data-id="'+b.id+'">編輯／取消訂單</button>':'')+'</div>'+
      (b?'<button class="pill '+(b.checked?'done':'dark')+'" data-act="'+(b.checked?'detail':'checkin')+'" data-id="'+b.id+'">'+(b.checked?'已登記':'登記')+'</button>':'<button class="pill ghost" data-act="new" data-k="'+r.k+'">＋ 新增</button>')+'</div>';
  }).join('')}
  return '<div class="wk"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>'+
   '<div class="cal">'+cells+'</div>'+
   '<div style="padding:12px 16px 0"><div class="muted" style="font-size:14px;text-align:center;margin-bottom:6px">顏色越深越滿，數字＝已住房數（共 '+ROOMS.length+' 間）；底部色條＝哪幾間有人；紅字＝週末，右上「休」＝國定假日，左上 ⚠＝當天入住有要注意的訂單</div><div class="legend">'+leg+'</div>'+
   '<div class="muted" style="display:flex;justify-content:space-between;font-size:14px;margin-top:4px"><span>全空</span><span>全滿</span></div>'+
   '<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px">'+ROOMS.map(function(r){return '<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:16px;height:6px;border-radius:2px;background:'+rc(r)+';display:inline-block"></i>'+rname(r)+'</span>'}).join('')+'</div></div>'+
   dayCard()+
   '<div class="foot" style="padding-top:12px"><div id="syncst">'+esc(syncLabel())+'</div><button class="linkbtn" data-act="tab" data-t="settings">設定</button></div>';
}

/* ---------- day status ---------- */
function regFor(b){var g=group(b),best=null;for(var i=0;i<g.length;i++){var r=regs[g[i].id];if(r&&(!best||r.ts>best.ts))best=r}return best}
function rocStr(by,bm,bd){return (by&&bm&&bd)?('民國 '+by+' 年 '+bm+' 月 '+bd+' 日（西元 '+(Number(by)+1911)+'）'):''}
function parseBirth(s){var m=/民國\s*(\d+)\s*年\s*(\d+)\s*月\s*(\d+)\s*日/.exec(s||'');return m?{by:m[1],bm:m[2],bd:m[3]}:{by:'',bm:'',bd:''}}
function regCard(b){
  var r=regFor(b);if(!r)return '';
  function kv(k,v){return v?'<div class="muted" style="font-size:14px">'+k+'</div><div style="font-size:17px;font-weight:500;word-break:break-all">'+v+'</div>':''}
  var comps=(r.comps||[]).map(function(p,i){return '<div style="border-top:1px solid #E4DED1;padding-top:10px;margin-top:10px"><b>同行旅客 '+(i+1)+'：'+esc(p.name||'')+'</b><div class="muted" style="font-size:15px;line-height:1.7">'+(p.idno?'證件 '+esc(p.idno)+'<br>':'')+(rocStr(p.by,p.bm,p.bd)?'生日 '+esc(rocStr(p.by,p.bm,p.bd)):'')+'</div></div>'}).join('');
  return '<div class="card"><div style="display:flex;align-items:center;gap:8px;font-weight:700;color:#34402F;margin-bottom:12px">✓ 已完成入住登記<span class="muted" style="margin-left:auto;font-size:13px;font-weight:400">'+esc(new Date(r.ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}))+'</span></div>'+
   '<div style="display:grid;grid-template-columns:72px minmax(0,1fr);row-gap:12px;align-items:center">'+kv('姓名',esc(r.name))+kv('證件號碼',esc(r.idno))+kv('生日',esc(rocStr(r.by,r.bm,r.bd)))+kv('電話',esc(fmtPh(r.phone||'')))+kv('車牌',esc(r.plate))+kv('地址',esc(r.addr))+kv('備註',esc(r.note))+'</div>'+comps+
   '<button class="ghostbtn" style="margin-top:14px" data-act="editreg" data-id="'+b.id+'">修改登記資料</button></div>';
}
function gInfo(b){
  var g=group(b),nights=Math.max(1,dayDiff(b.from,b.to)),total=g.reduce(function(s,x){return s+(x.price||0)},0)*nights,dep=g.reduce(function(s,x){return s+(x.deposit||0)},0);
  return {g:g,nights:nights,total:total,dep:dep,bal:Math.max(0,total-dep),paid:g.some(function(x){return x.paid}),n:g.reduce(function(s,x){return s+(x.n||0)},0),
    warn:(g.filter(function(x){return x.warn})[0]||{warn:''}).warn,
    rooms:g.map(function(x){var r=room(x.room);return r?rname(r):x.room}).join('、')};
}
function noticeText(b){
  var M=CFG.msg;if(!M)return '';
  var I=gInfo(b);
  function roc(iso){return (+iso.slice(0,4)-1911)+'/'+iso.slice(5,7)+'/'+iso.slice(8,10)+'（'+'日一二三四五六'.charAt(new Date(Date.parse(iso)).getUTCDay())+'）'}
  var lines=I.g.map(function(x){var r=room(x.room);return '•'+((r&&M.types[r.no])||(r?rname(r):x.room))+'｜$'+(x.price||0)+'元*'+I.nights+'晚'}).join('\n');
  return M.tpl.replace('{入住}',roc(b.from)).replace('{退房}',roc(b.to)).replace('{房型明細}',lines).replace('{合計}',I.total).replace('{訂金}',Math.round(I.total/2));
}
function uniqGroups(list){var seen={},out=[];list.forEach(function(b){var k=[b.who,b.phone,b.from,b.to].join('|');if(!seen[k]){seen[k]=1;out.push(b)}});return out}
function fmtPh(p){p=digits(p);return p.length===10?p.slice(0,4)+' '+p.slice(4,7)+' '+p.slice(7):p}
function dayLine(b,right,sub){
  var I=gInfo(b),bk=backInfo(b.phone,b.from,b.id);
  return '<div class="row" style="min-height:56px"><button class="rowmain" data-act="detail" data-id="'+b.id+'"><div style="font-size:17px;font-weight:700">'+esc(b.who||'（已清除）')+(bk?' <span class="back back-pill">回流</span>':'')+'</div><div class="muted" style="font-size:14px">'+esc(I.rooms)+'・'+I.n+' 人'+(sub||'')+(b.src?'・'+esc(b.src):'')+'</div>'+(I.warn?'<div style="color:#B3261E;font-size:14px;font-weight:700">⚠ '+esc(I.warn)+'</div>':'')+'</button>'+right+'</div>';
}
function dayCard(){
  var sel=app.sel,ins=uniqGroups(bookings.filter(function(b){return b.from===sel})),outs=uniqGroups(bookings.filter(function(b){return b.to===sel}));
  var empty=ROOMS.filter(function(r){return !find(r.k,sel)});
  var none='<div class="muted" style="font-size:15px;padding:6px 0 4px">沒有</div>';
  var inH=ins.map(function(b){return dayLine(b,'<button class="pill '+(b.checked?'done':'dark')+'" data-act="'+(b.checked?'detail':'checkin')+'" data-id="'+b.id+'">'+(b.checked?'已登記':'登記')+'</button>')}).join('')||none;
  var outH=outs.map(function(b){var I=gInfo(b);return dayLine(b,I.paid?'<span class="pill done">尾款已收</span>':(I.bal>0?'<span style="text-align:right;font-size:14px;line-height:1.3" class="muted">尾款<br><b style="color:#2B2A27;font-size:16px">'+money(I.bal)+'</b></span>':'<span class="muted" style="font-size:14px">無尾款</span>'))}).join('')||none;
  function rrow(r){
    var b=find(r.k,sel);
    return '<div class="row"><span class="bar" style="background:'+rc(r)+'"></span><div class="no" style="width:'+(r.label?'92px':'64px')+'"><b>'+(r.label?r.label+' ':'')+r.no+'</b><span>'+r.cap+' 人房</span></div>'+
     (b?'<button class="rowmain" data-act="detail" data-id="'+b.id+'"><div style="font-size:16px;font-weight:500">'+esc(b.who||'（已清除）')+' · '+b.n+' 人'+(b.warn?' <span style="color:#B3261E">⚠</span>':'')+'</div><div class="muted" style="font-size:14px">'+md(b.from)+' – '+md(b.to)+'</div></button>':'<div class="who muted" style="font-size:16px">空房</div><button class="pill ghost" data-act="new" data-k="'+r.k+'">＋ 新增</button>')+'</div>';
  }
  var isToday=sel===TODAY;
  return '<div class="card" style="margin:12px 16px 0;padding:14px 16px 10px"><div class="serif" style="font-size:20px;font-weight:600;letter-spacing:.04em;margin-bottom:10px">'+(+sel.split('-')[1])+' 月 '+(+sel.split('-')[2])+' 日　週'+wday(sel)+(holName(sel)?'　<span style="font-size:14px;color:#B3261E">'+esc(holName(sel))+'放假</span>':'')+(isToday?'　<span style="font-size:14px;color:#B4521F">今天</span>':'')+'</div>'+
   '<div class="tiles"><div class="tile" style="background:#F6E4D8;color:#6E2E0C"><b>'+ins.length+'</b><span>入住</span></div><div class="tile" style="background:#DCEAF3;color:#124B6D"><b>'+outs.length+'</b><span>退房</span></div><div class="tile" style="background:#E6EBE2;color:#34402F"><b>'+empty.length+'</b><span>空房</span></div></div>'+
   '<div class="sech">今天入住'.replace('今天',isToday?'今天':'這天')+'</div>'+inH+
   '<div class="sech">'+(isToday?'今天':'這天')+'退房</div>'+outH+
   '<div class="sech">各房間</div>'+CFG.groups.map(function(g){return (g.flat?'':'<div class="grp" style="padding:8px 0 4px;margin:0"><span class="dot" style="background:'+g.color+'"></span>'+g.name+'</div>')+g.list.map(rrow).join('')}).join('')+'</div>';
}

/* ---------- order detail ---------- */
function viewDetail(){

  if(!b)return '<div class="pad"><div class="card muted" style="font-size:18px">找不到這筆訂單（可能已取消）</div><button class="ghostbtn" data-act="tab" data-t="cal">回房況</button></div>';
  var I=gInfo(b),bk=backInfo(b.phone,b.from,b.id),note=(I.g.filter(function(x){return x.note})[0]||{note:''}).note;
  function kv(k,v){return '<div class="muted" style="font-size:14px">'+k+'</div><div style="font-size:18px;font-weight:500">'+v+'</div>'}

   (I.warn?'<div class="alert" style="font-size:16px;font-weight:700">⚠ '+esc(I.warn)+'</div>':'')+

   (b.phone?'<a class="telbtn" style="margin-top:12px" href="tel:'+esc(digits(b.phone))+'" aria-label="撥打電話 '+esc(fmtPh(b.phone))+'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span style="flex:1">'+esc(fmtPh(b.phone))+'</span><span style="font-size:14px">點一下撥打</span></a>':'<div class="muted" style="margin-top:10px">沒有留電話</div>')+
   '<div style="display:grid;grid-template-columns:72px minmax(0,1fr);row-gap:12px;margin-top:16px;align-items:center">'+kv('怎麼訂的',esc(b.src||'—'))+(b.bookedOn?kv('預訂日期',md(b.bookedOn)+'（'+b.bookedOn.slice(0,4)+'）'):'')+kv('日期',md(b.from)+' – '+md(b.to)+'　共 '+I.nights+' 晚')+kv('房間',esc(I.rooms))+kv('人數',I.n+' 人')+(note?kv('備註',esc(note)):'')+'</div></div>'+

function stats(y,m){
  var dim=daysIn(y,m),fd=firstDow(y,m),wn=Math.ceil((fd+dim)/7),wk=[],i;

  var by={};ROOMS.forEach(function(r){by[r.k]={rev:0,nights:0}});
  var src={},total=0,dep=0,nights=0;
  bookings.forEach(function(b){
    var hit=false;
    for(var d=1;d<=dim;d++){var iso=ymd(y,m,d);
      if(b.from<=iso&&iso<b.to){total+=b.price;nights++;by[b.room].rev+=b.price;by[b.room].nights++;src[b.src]=(src[b.src]||0)+b.price;wk[Math.floor((d-1+fd)/7)]+=b.price;hit=true}}
    if(hit)dep+=b.deposit;
  });
  return {dim:dim,fd:fd,wk:wk,by:by,src:src,total:total,dep:dep,nights:nights};
}

function syncLabel(){

function paintSync(){var el=document.getElementById('syncst');if(el)el.textContent=syncLabel();var ds=document.querySelectorAll('.sdot');for(var i=0;i<ds.length;i++){ds[i].style.background=syncColor();ds[i].title=syncLabel()}}
function sync(){
  if(!syncCfg.url||!syncCfg.token||syncing||!navigator.onLine)return Promise.resolve();
  syncing=true;syncMsg='';paintSync();
  var sentDirty=dirty.slice(),tombKeys=Object.keys(tomb),sentCi=ciq.slice(),sentFq=fq.slice();
  var rows=bookings.filter(function(b){return sentDirty.indexOf(b.id)>=0}).concat(tombKeys.map(function(k){return tomb[k]}));
  return fetch(syncCfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:syncCfg.token,action:'sync',rows:rows,checkins:sentCi,keep:!!settings.keep,forget:sentFq})})
   .then(function(r){return r.json()}).then(function(res){
    if(!res.ok)throw new Error(res.error||'未知錯誤');
    dirty=dirty.filter(function(id){return sentDirty.indexOf(id)<0});save(DKEY,dirty);
    tombKeys.forEach(function(k){delete tomb[k]});save(TKEY,tomb);
    ciq=ciq.filter(function(c){return sentCi.indexOf(c)<0});save(QKEY,ciq);
    fq=fq.filter(function(p){return sentFq.indexOf(p)<0});save(FQKEY,fq);
    (res.regs||[]).forEach(function(r){var id=Number(r.bookingId),old=regs[id];if(old&&old.ts>=Number(r.ts))return;if(ciq.some(function(c){return c.bookingId===id}))return;var bd=parseBirth(r.birth),comps=[];try{comps=(r.companions||[]).map(function(p){var q=parseBirth(p.birth);return {name:p.name||'',idno:p.idno||'',by:q.by,bm:q.bm,bd:q.bd}})}catch(e){}
      regs[id]={ts:Number(r.ts),checkout:r.checkout,name:r.name,idno:r.idno,by:bd.by,bm:bd.bm,bd:bd.bd,phone:fixPh(r.phone),plate:r.plate,addr:r.addr,note:r.note,comps:comps}});save(RKEY,regs);
    var local={};bookings.forEach(function(b){local[b.id]=b});
    var out=[],seen={};
    res.rows.forEach(function(r){seen[r.id]=1;r.phone=fixPh(r.phone);if(tomb[r.id])return;if(dirty.indexOf(r.id)>=0&&local[r.id]){out.push(local[r.id]);return}if(!r.deleted)out.push(r)});
    bookings.forEach(function(b){if(!seen[b.id]&&dirty.indexOf(b.id)>=0)out.push(b)});
    bookings=out;persist();syncCfg.last=Date.now();save(SKEY,syncCfg);
    if(app.tab==='cal'||app.tab==='rev'||app.tab==='detail'){var y=window.scrollY;render();window.scrollTo(0,y)}
  }).catch(function(e){syncMsg=(e&&e.message)||'連不上'}).then(function(){syncing=false;paintSync()});
}

  return '<div class="pad"><div class="card" style="line-height:1.6;font-size:16px"><b>多人共用</b><br>貼上「Google 試算表」的同步網址與密碼，這支手機就會和家人的手機看到同一份訂單。設定方法請看「同步設定說明」。</div>'+
   '<div><label class="lbl" for="s-url">同步網址</label><input id="s-url" class="inp" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(sd.url)+'" data-in="s.url"></div>'+
   '<div><label class="lbl" for="s-token">密碼</label><input id="s-token" class="inp" type="text" autocapitalize="off" autocomplete="off" placeholder="與試算表指令碼裡設定的密碼相同" value="'+esc(sd.token)+'" data-in="s.token"></div>'+

   '<div class="card" style="line-height:1.6"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b style="font-size:17px">App 版本 '+APPV+'</b><div class="muted" style="font-size:14px;margin-top:4px">看不到新功能時，按右邊更新；訂單資料不會被清掉。</div></div><button class="ghostbtn" style="width:auto;padding:0 16px" data-act="upd">更新</button></div></div>'+

}
/* ---------- events ---------- */
function setPath(path,val){
  var c=app.ci;if(!c)return;var p=path.split('.');
  if(p[0]==='ci'){c[p[1]]=val}
  else if(p[0]==='comp'){c.comps[+p[1]][p[2]]=val}
}
var APPV='v19';
var act={
  upd:function(){toast('更新中…');Promise.all([navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}):0,window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}):0]).catch(function(){}).then(function(){location.reload()})},
  tab:function(d){if(d.t!=='order'&&app.order&&app.order.editIds)app.order=freshOrder(app.sel);app.tab=d.t;render();window.scrollTo(0,0)},
  mon:function(d){var m=app.m+Number(d.d),y=app.y;if(m<1){m=12;y--}if(m>12){m=1;y++}app.y=y;app.m=m;app.sel=ymd(y,m,1);render()},
  pick:function(d){app.sel=d.d;render()},
  reset:function(){if(!confirm('確定要清除所有訂單資料嗎？清除後無法復原。'))return;bookings=[];dirty=[];tomb={};ciq=[];save(DKEY,dirty);save(TKEY,tomb);save(QKEY,ciq);persist();app.tab='cal';app.order=freshOrder(TODAY);app.ci=null;app.checkId=null;app.sel=TODAY;render();toast(syncCfg.url?'已清除，下次同步會從試算表重新載入':'已清除所有資料')},
  'new':function(d){var o=freshOrder(app.sel);o.custom=app.sel!==TODAY;o.rooms[d.k]=true;o.guests[d.k]={a:Math.min(2,room(d.k).cap),c:0};app.order=o;app.tab='order';render();window.scrollTo(0,0)},
  editreg:function(d){var b=bookings.filter(function(x){return x.id===Number(d.id)})[0];if(!b)return;var r=regFor(b);if(!r)return;var rid=Number(Object.keys(regs).filter(function(k){return regs[k]===r})[0]);
    app.checkId=rid||b.id;app.ci={id:app.checkId,name:r.name,idno:r.idno,by:r.by||'',bm:r.bm||'',bd:r.bd||'',phone:r.phone||'',plate:r.plate||'',addr:r.addr||'',note:r.note||'',comps:(r.comps||[]).map(function(p){return {name:p.name||'',idno:p.idno||'',by:p.by||'',bm:p.bm||'',bd:p.bd||''}}),scanned:false};app.tab='checkin';render();window.scrollTo(0,0)},
  checkin:function(d){app.checkId=Number(d.id);app.ci=null;app.tab='checkin';render();window.scrollTo(0,0)},
  room:function(d){var o=app.order;if(o.rooms[d.k]){delete o.rooms[d.k];delete o.guests[d.k]}else{var bz=busyFor(room(d.k));if(bz){toast(rname(room(d.k))+' 這幾天已有訂單（'+(bz.who||'已清除')+'）');return}o.rooms[d.k]=true;o.guests[d.k]={a:Math.min(2,room(d.k).cap),c:0}}refreshRooms();refreshGuests();refreshPriceRows();refreshCalc()},
  adj:function(d){var g=app.order.guests[d.k];if(!g)return;g[d.f]=Math.max(d.f==='a'?1:0,g[d.f]+Number(d.d));refreshGuests()},
  src:function(d){app.order.src=d.s;refreshSrc()},
  save:function(){saveOrder(false)},
  next:function(){var o=app.order,s=o.step||1;if(!checkStep(s))return;o.step=Math.min(3,s+1);render();window.scrollTo(0,0)},
  prev:function(){var o=app.order;o.step=Math.max(1,(o.step||1)-1);render();window.scrollTo(0,0)},
  chip:function(d){var o=app.order;if(d.c==='today'){o.inD=TODAY;o.outD=addDay(TODAY,1);o.custom=false}else if(d.c==='wknd'){var f=wkndStart();o.inD=f;o.outD=addDay(f,2);o.custom=false}else{o.custom=true}refreshChips();refreshNights();refreshRooms()},
  wchip:function(d){var o=app.order;o.warn=d.w;var e=$i('o-warn');if(e)e.value=d.w},
  pp:function(d){app.order.price[d.k]=Number(d.v);refreshPriceRows();refreshCalc()},
  dupno:function(){closeDlg();app.order=freshOrder(app.sel);app.tab='cal';render();window.scrollTo(0,0)},
  dupgo:function(){closeDlg();saveOrder(true)},
  undo:function(){var f=undoFn;hideSnack();if(f)f()},
  detail:function(d){app.detailId=Number(d.id);app.tab='detail';render();window.scrollTo(0,0)},
  copymsg:function(d){var b=bookings.filter(function(x){return x.id===Number(d.id)})[0];if(!b)return;var s=noticeText(b);
    function fb(){var ta=document.createElement('textarea');ta.value=s;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已複製，可貼到 LINE / 訊息')}catch(e){toast('複製失敗，請展開預覽手動複製')}ta.remove()}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast('已複製，可貼到 LINE / 訊息')},fb)}else fb()},
  flow:function(){settings.flow=onePage()?'step':'one';save(STKEY,settings);var y=window.scrollY;render();window.scrollTo(0,y);toast(onePage()?'新增訂單改為整頁填寫':'新增訂單改為分三步驟')},
  paid:function(d){var b=bookings.filter(function(x){return x.id===Number(d.id)})[0];if(!b)return;var g=group(b),v=!g.some(function(x){return x.paid});g.forEach(function(x){x.paid=v;touch(x)});persist();sync();render()},
  cancelgrp:function(d){var b=bookings.filter(function(x){return x.id===Number(d.id)})[0];if(!b)return;var nm=b.who;cancelGroup(group(b).map(function(x){return x.id}),nm);app.tab='cal';render();window.scrollTo(0,0)},
  keep:function(){if(settings.keep){var cut=addDay(TODAY0(),-183);var n=bookings.filter(function(b){return b.to<cut&&(b.who||b.phone)}).length;if(!confirm('關閉後，超過 6 個月的訂單會立刻清除姓名和電話'+(n?'（目前有 '+n+' 筆）':'')+'，確定嗎？'))return}settings.keep=!settings.keep;save(STKEY,settings);purgeLocal();sync();var y=window.scrollY;render();window.scrollTo(0,y);toast(settings.keep?'已開啟：保留回流客名單':'已關閉：6 個月後清除姓名電話')},
  forget:function(){var m=forgetMatches();if(!m.length)return;var p=digits(app.fp);if(!confirm('確定刪除「'+(m[0].who||'這位旅客')+'」所有訂單上的姓名、電話、備註，以及登記資料嗎？無法復原。'))return;m.forEach(function(b){b.who='';b.phone='';b.note='';touch(b)});ciq=ciq.filter(function(c){return digits(c.phone)!==p});save(QKEY,ciq);Object.keys(regs).forEach(function(k){if(digits(regs[k].phone)===p)delete regs[k]});save(RKEY,regs);if(fq.indexOf(p)<0)fq.push(p);save(FQKEY,fq);persist();app.fp='';sync();var y=window.scrollY;render();window.scrollTo(0,y);toast('已刪除 '+m.length+' 筆訂單上的個人資料')},
  edit:function(d){var b=bookings.filter(function(x){return x.id===Number(d.id)})[0];if(!b)return;var g=group(b),o=freshOrder(b.from);o.outD=b.to;o.name=b.who;o.phone=b.phone;o.src=b.src||o.src;o.booked=b.bookedOn||'';o.warn=(g.filter(function(x){return x.warn})[0]||{warn:''}).warn;o.note=(g.filter(function(x){return x.note})[0]||{note:''}).note;var dp=g.reduce(function(s,x){return s+(x.deposit||0)},0);o.deposit=dp?String(dp):'';g.forEach(function(x){o.rooms[x.room]=true;o.guests[x.room]={a:Math.max(1,x.n),c:0};o.price[x.room]=x.price||0});o.editIds=g.map(function(x){return x.id});app.order=o;app.tab='order';render();window.scrollTo(0,0)},
  canceledit:function(){app.order=freshOrder(app.sel);app.tab='cal';render();window.scrollTo(0,0)},
  delorder:function(){var ids=app.order.editIds||[];if(!ids.length)return;var nm=app.order.name;cancelGroup(ids,nm);app.order=freshOrder(app.sel);app.tab='cal';render();window.scrollTo(0,0)},
  sort:function(d){app.sort=d.s;render()},
  'export':exportCsv,
  addcomp:function(){app.ci.comps.push({name:'',idno:'',by:'',bm:'',bd:''});var y=window.scrollY;render();window.scrollTo(0,y)},
  delcomp:function(d){app.ci.comps.splice(Number(d.i),1);var y=window.scrollY;render();window.scrollTo(0,y)},
  cancel:function(){var b=currentBooking();if(!b)return;var nm=b.who;cancelGroup(group(b).map(function(x){return x.id}),nm);app.ci=null;app.checkId=null;app.tab='cal';render();window.scrollTo(0,0)},
  ssave:function(){var sd=app.sd||{};syncCfg.url=(sd.url||'').trim();syncCfg.token=(sd.token||'').trim();syncCfg.last=0;save(SKEY,syncCfg);syncMsg='';paintSync();toast(syncCfg.url?'已儲存，開始同步':'已清除同步設定');
    if(syncCfg.url){bookings.forEach(function(b){if(dirty.indexOf(b.id)<0)dirty.push(b.id)});save(DKEY,dirty);sync().then(function(){paintSync();if(syncMsg)toast('同步失敗：'+syncMsg)})}},
  finish:function(){
    var b=currentBooking();if(!b||!app.ci)return;
    if(!app.ci.name.trim()){toast('請輸入姓名');return}
    var c=app.ci,ts=Date.now();
    group(b).forEach(function(x){delete regs[x.id]});
    regs[b.id]={ts:ts,checkout:b.to,name:c.name.trim(),idno:c.idno.trim().toUpperCase(),by:c.by,bm:c.bm,bd:c.bd,phone:c.phone,plate:c.plate,addr:c.addr,note:c.note,comps:c.comps.map(function(p){return {name:p.name,idno:(p.idno||'').toUpperCase(),by:p.by,bm:p.bm,bd:p.bd}})};save(RKEY,regs);
    ciq.push({bookingId:b.id,ts:ts,checkout:b.to,name:c.name.trim(),idno:c.idno.trim().toUpperCase(),birth:(c.by&&c.bm&&c.bd)?('民國 '+c.by+' 年 '+c.bm+' 月 '+c.bd+' 日'):'',phone:c.phone,plate:c.plate,addr:c.addr,note:c.note,companions:c.comps.map(function(p){return {name:p.name,idno:p.idno.toUpperCase(),birth:(p.by&&p.bm&&p.bd)?('民國 '+p.by+' 年 '+p.bm+' 月 '+p.bd+' 日'):''}}),rooms:group(b).map(function(x){return rname(room(x.room))}).join('、')});
    save(QKEY,ciq);
    group(b).forEach(function(x){x.checked=true;touch(x)});persist();sync();
    var n=app.ci.name;app.ci=null;app.checkId=null;app.tab='cal';render();window.scrollTo(0,0);toast('已完成入住登記：'+n);
  }
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=act[t.dataset.act];if(f)f(t.dataset,t,e)});
document.addEventListener('input',function(e){
  var t=e.target.closest('[data-in]');if(!t)return;var k=t.dataset.in,v=t.value,o=app.order;
  if(k==='inD'){o.inD=v;if(dayDiff(o.inD,o.outD)<1){o.outD=addDay(v,1);var oe=document.getElementById('o-out');if(oe)oe.value=o.outD}refreshNights();refreshRooms();refreshCalc()}
  else if(k==='s.url'){(app.sd=app.sd||{}).url=v}
  else if(k==='s.token'){(app.sd=app.sd||{}).token=v}
  else if(k==='booked'){o.booked=v}
  else if(k==='warn'){o.warn=v}
  else if(k==='fphone'){app.fp=v;refreshForget()}
  else if(k==='outD'){o.outD=v;refreshNights();refreshRooms();refreshCalc()}
  else if(k==='name'){o.name=v}
  else if(k==='phone'){o.phone=v;refreshBack()}
  else if(k==='note'){o.note=v}
  else if(k==='deposit'){o.deposit=v;refreshCalc()}
  else if(k==='price'){o.price[t.dataset.k]=Number(digits(v))||0;refreshCalc()}
  else if(k.indexOf('ci.')===0||k.indexOf('comp.')===0){setPath(k,v);if(k.indexOf('ci.')===0)refreshCi()}
});

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
purgeLocal();render();
sync();
document.addEventListener('visibilitychange',function(){if(!document.hidden){purgeLocal();sync()}});
window.addEventListener('online',sync);
setInterval(function(){if(!document.hidden)sync()},60000);
})();
